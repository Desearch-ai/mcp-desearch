name: Publish to npm and the MCP Registry

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Publish only from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Refusing to publish from $GITHUB_REF. This workflow publishes only from main."
            exit 1
          fi

      - name: Check out the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Read package version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if version already published
        id: check
        run: |
          if npm view "desearch-mcp-server@${{ steps.pkg.outputs.version }}" version > /dev/null 2>&1; then
            echo "desearch-mcp-server@${{ steps.pkg.outputs.version }} already on npm — skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install, build, and test
        if: steps.check.outputs.skip == 'false'
        run: npm ci && npm run build && npm test

      - name: Upgrade npm for Trusted Publishing
        if: steps.check.outputs.skip == 'false'
        # Same pin as desearch.js: npm 12 needs Node 22.22.2+, npm 11 supports OIDC publishing on Node 20.
        run: npm install -g npm@11.19.1

      - name: Publish to npm
        if: steps.check.outputs.skip == 'false'
        run: npm publish --access public --provenance

      - name: Tag release
        if: steps.check.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      # Independent of the npm skip above: publish server.json whenever this
      # name and version are not in the registry yet, then no-op on reruns.
      # https://github.com/modelcontextprotocol/registry/blob/main/docs/modelcontextprotocol-io/github-actions.mdx
      - name: Verify server.json matches package.json
        run: |
          node --input-type=commonjs <<'EOF'
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const server = JSON.parse(fs.readFileSync("server.json", "utf8"));
          const errors = [];
          if (server.version !== pkg.version) {
            errors.push(
              "server.json version " +
                server.version +
                " != package.json version " +
                pkg.version
            );
          }
          if (server.name !== pkg.mcpName) {
            errors.push(
              "server.json name " +
                server.name +
                " != package.json mcpName " +
                pkg.mcpName
            );
          }
          if (errors.length) {
            console.error(errors.join("\n"));
            process.exit(1);
          }
          console.log(
            "server.json matches package.json: " + server.name + "@" + server.version
          );
          EOF

      - name: Check if version is in the MCP Registry
        id: registry
        run: |
          name=$(node --input-type=commonjs -p "JSON.parse(require('fs').readFileSync('server.json','utf8')).name")
          version=$(node --input-type=commonjs -p "JSON.parse(require('fs').readFileSync('server.json','utf8')).version")
          encoded_name=$(node --input-type=commonjs -p "encodeURIComponent(process.argv[1])" "$name")
          encoded_version=$(node --input-type=commonjs -p "encodeURIComponent(process.argv[1])" "$version")
          url="https://registry.modelcontextprotocol.io/v0.1/servers/${encoded_name}/versions/${encoded_version}"
          code=$(curl -sS --retry 3 --retry-delay 2 -o /tmp/mcp-registry-version.json -w "%{http_code}" "$url")
          if [ "$code" = "200" ]; then
            echo "MCP Registry already has ${name}@${version} — skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "404" ]; then
            echo "MCP Registry does not have ${name}@${version} — publishing."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "MCP Registry lookup failed: HTTP ${code} ${url}"
            cat /tmp/mcp-registry-version.json
            exit 1
          fi

      # Pinned to registry release v1.8.1. Digest matches the GitHub release asset
      # and registry_1.8.1_checksums.txt (mcp-publisher_linux_amd64.tar.gz).
      - name: Install mcp-publisher
        if: steps.registry.outputs.skip == 'false'
        run: |
          version="1.8.1"
          archive="mcp-publisher_linux_amd64.tar.gz"
          url="https://github.com/modelcontextprotocol/registry/releases/download/v${version}/${archive}"
          expected="a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
          curl -fsSL --retry 3 --retry-delay 2 -o "$archive" "$url"
          echo "${expected}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" mcp-publisher
          chmod +x ./mcp-publisher

      - name: Authenticate to MCP Registry
        if: steps.registry.outputs.skip == 'false'
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        if: steps.registry.outputs.skip == 'false'
        run: ./mcp-publisher publish
