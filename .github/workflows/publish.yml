name: Publish to npm

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Publish only from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Refusing to publish from $GITHUB_REF. This workflow publishes only from main."
            exit 1
          fi

      - name: Check out the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Read package version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if version already published
        id: check
        run: |
          if npm view "desearch-mcp-server@${{ steps.pkg.outputs.version }}" version > /dev/null 2>&1; then
            echo "desearch-mcp-server@${{ steps.pkg.outputs.version }} already on npm — skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install, build, and test
        if: steps.check.outputs.skip == 'false'
        run: npm ci && npm run build && npm test

      - name: Upgrade npm for Trusted Publishing
        if: steps.check.outputs.skip == 'false'
        # npm 12 needs Node 22.19+. npm 11 supports OIDC trusted publishing on Node 20.
        # No NPM_TOKEN. npm uses the GitHub OIDC token from id-token: write.
        run: npm install -g npm@11.19.1

      - name: Publish to npm
        if: steps.check.outputs.skip == 'false'
        run: npm publish --provenance --access public

      - name: Tag release
        if: steps.check.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
