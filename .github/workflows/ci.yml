name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install, build, and test
        run: npm ci && npm run build && npm test

  # Glama (and any fresh marketplace clone) installs with pnpm and no
  # pnpm-lock.yaml, so package.json ranges resolve past the npm lockfile.
  # That is the toolchain that failed http.ts with TS2322.
  marketplace-gate:
    name: Marketplace Gate (pnpm, Node 24, no lockfile)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.4 --activate
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      - name: Install and build without the npm lockfile
        run: |
          rm -f package-lock.json
          pnpm install
          pnpm run build
          pnpm test
